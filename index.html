<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petualangan Kita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--fs:18px}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Lora',Georgia,serif;background:#a7d2ee;color:#1f4468}
.sky{position:fixed;inset:0;opacity:0;transition:opacity 1.2s;z-index:-1}
.sky.on{opacity:1}
.sky.s0{background:linear-gradient(#a7d2ee,#e9f5fc)}
.sky.s1{background:linear-gradient(#f6fbfe,#cfe6f5)}
.sky.s2{background:linear-gradient(#1f4468,#3f7fb5 80%,#8ec5ea)}
.cloud{position:fixed;height:54px;width:170px;background:#fff;border-radius:60px;opacity:.7;animation:drift 70s linear infinite;z-index:0}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:70px;height:70px;left:24px;top:-34px}
.cloud::after{width:50px;height:50px;left:80px;top:-22px}
@keyframes drift{from{transform:translateX(-240px)}to{transform:translateX(110vw)}}
#balloons{position:fixed;inset:0;z-index:0;pointer-events:none}
.b{position:absolute;width:var(--w);height:calc(var(--w)*1.18);border-radius:50% 50% 50% 50%/58% 58% 42% 42%;background:var(--c);
 box-shadow:inset -8px -10px 0 rgba(31,68,104,.12),0 2px 6px rgba(31,68,104,.12);transition:left 2.4s ease,top 2.4s ease;animation:sway var(--d) ease-in-out infinite alternate}
.b::before{content:"";position:absolute;left:18%;top:14%;width:20%;height:26%;background:rgba(255,255,255,.55);border-radius:50%;rotate:25deg}
.b::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:90px;background:rgba(31,68,104,.35);transform-origin:top;animation:str var(--d) ease-in-out infinite alternate}
@keyframes sway{from{transform:translateY(-10px) rotate(-4deg)}to{transform:translateY(12px) rotate(4deg)}}
@keyframes str{from{rotate:3deg}to{rotate:-3deg}}

/* ---- halaman ---- */
#stage{position:relative;z-index:1;height:100%}
.slide{position:absolute;inset:0;overflow:hidden auto;display:flex;padding:68px 5vw 90px;color:var(--ink);
 opacity:0;visibility:hidden;transform:translateY(16px);transition:opacity .6s,transform .6s,visibility .6s}
.slide.on{opacity:1;visibility:visible;transform:none}
.P0,.P1{--ink:#1f4468;--paper:rgba(255,255,255,.88);--acc:#4a90c8}
.P2{--ink:#eef6fc;--paper:rgba(18,50,84,.84);--acc:#9fd0f0}
.in{margin:auto;display:flex;align-items:center;justify-content:center;gap:clamp(24px,5vw,72px);width:100%;max-width:1100px}

/* kolase polaroid */
.vis{position:relative;flex:none;width:min(var(--vw),88vw)}
.pics{position:relative;width:100%;container-type:inline-size;aspect-ratio:var(--ar)}
.pol{position:absolute;left:calc(var(--x)*1%);top:calc(var(--y)*1%);width:calc(var(--k)*1%);
 padding:calc(var(--k)*.045*1%) calc(var(--k)*.045*1%) calc(var(--k)*.17*1%);background:#fff;rotate:var(--r);
 box-shadow:0 12px 26px rgba(31,68,104,.28),0 2px 4px rgba(31,68,104,.15);transition:rotate .3s,scale .3s}
.pol:hover{rotate:0deg;scale:1.05;z-index:9}
.pol::before{content:"";position:absolute;top:-4%;left:50%;width:34%;aspect-ratio:3.4;margin-left:-17%;background:rgba(190,220,240,.82);rotate:-4deg}
.pol:nth-child(even)::before{rotate:5deg;background:rgba(150,195,225,.7)}
.m{aspect-ratio:1;background:#dcebf5;overflow:hidden;position:relative}
.m img,.m video{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.m video{cursor:auto}
.m.empty img,.m.empty video{display:none}
.m.empty::after{content:"foto / video\A " attr(data-p);white-space:pre-wrap;word-break:break-all;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
 font:500 max(11px,calc(var(--k)*.065cqw))/1.3 'Caveat',cursive;color:#7fa6c4;border:2px dashed #b4d0e4;margin:5%;padding:4px}
.cap{position:absolute;left:0;right:0;bottom:calc(var(--k)*.045cqw);text-align:center;line-height:1;font:700 max(13px,calc(var(--k)*.09cqw)) 'Caveat',cursive;color:#1f4468}

/* karakter */
.chars{display:flex;justify-content:center;gap:10px;margin-top:-30px;position:relative;z-index:6}
.char{width:min(118px,26vw);aspect-ratio:3/4;position:relative;animation:bob 3.2s ease-in-out infinite alternate;filter:drop-shadow(0 6px 6px rgba(31,68,104,.25))}
.char:nth-child(2){animation-delay:-1s}.char:nth-child(3){animation-delay:-2s}
@keyframes bob{from{translate:0 -4px}to{translate:0 5px}}
.char img{width:100%;height:100%;object-fit:contain}
.char.empty{filter:none}.char.empty img{display:none}
.char.empty::after{content:attr(data-n) "\A taruh PNG";white-space:pre;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
 font:500 19px/1.2 'Caveat',cursive;border:2px dashed currentColor;border-radius:50% 50% 14px 14px;opacity:.75;background:rgba(255,255,255,.25)}

/* cerita */
.story{background:var(--paper);padding:28px 32px;border-radius:4px;max-width:540px;width:100%;box-shadow:0 8px 24px rgba(31,68,104,.16);max-height:calc(100dvh - 170px);overflow-y:auto}
.no{font:500 25px 'Caveat',cursive;color:var(--acc)}
h2{font-weight:600;font-size:clamp(26px,4vw,36px);line-height:1.2;margin:0 0 14px}
.body{font-size:var(--fs);line-height:1.9}
.body p{text-align:justify;hyphens:auto}
.body p+p{text-indent:1.6em}
.body p:first-child:not(.ph)::first-letter{float:left;font-size:3.3em;line-height:.85;padding:5px 9px 0 0;color:var(--acc)}
.ph{opacity:.65;font-style:italic;border:1.5px dashed currentColor;padding:14px;border-radius:4px;text-align:left!important}

/* ---- 10 tata letak ---- */
.L2 .in{flex-direction:row-reverse}
.L3 .in,.L9 .in{flex-direction:column;gap:34px}
.L4 .in{flex-direction:column-reverse;gap:34px}
.L3 .story,.L4 .story,.L9 .story{max-height:none;max-width:660px}
.L5 .in{background:var(--paper);padding:38px;border-radius:6px;box-shadow:0 10px 30px rgba(31,68,104,.2);position:relative;gap:46px}
.L5 .in::after{content:"";position:absolute;left:50%;top:14px;bottom:14px;width:3px;background:linear-gradient(90deg,rgba(31,68,104,.22),transparent)}
.L5 .story,.L6 .story,.L7 .story{background:none;box-shadow:none;padding:0}
.L5 .story{max-height:calc(100dvh - 240px)}
.L6 .in,.L7 .in{display:block;max-width:760px;background:var(--paper);padding:34px;border-radius:4px;box-shadow:0 10px 30px rgba(31,68,104,.2)}
.L6 .story,.L7 .story{max-width:none;max-height:none;overflow:visible}
.L6 .vis{float:right;margin:8px 0 16px 28px;width:min(var(--sw),48%)}
.L7 .vis{float:left;margin:8px 28px 16px 0;width:min(var(--sw),48%)}
.L7 .in{border-left:6px solid var(--acc)}
.L8 .in{flex-direction:column;max-width:680px;text-align:center;gap:34px}
.L8 .vis{width:min(var(--sw),82vw)}
.L8 .story{background:none;box-shadow:none;max-height:none;max-width:none}
.L8 .body{font-style:italic;font-size:calc(var(--fs) + 3px)}
.L8 .body p{text-align:center;text-indent:0!important}
.L8 .body p::first-letter{all:unset!important}
.L9 .in{padding-top:40px}
.L9 .vis::before{content:"";position:absolute;top:-16px;left:-60px;right:-60px;height:2px;background:var(--ink);opacity:.45}
.L9 .pol{transform-origin:50% 0;animation:swing 4.5s ease-in-out infinite alternate;animation-delay:calc(var(--x)*-.05s)}
.L9 .pol::before{width:9%;aspect-ratio:1/2.4;margin-left:-4.5%;top:-9%;background:#fff;border:1px solid #9cbbd2;border-radius:3px;rotate:0deg!important}
@keyframes swing{from{rotate:calc(var(--r) - 2.5deg)}to{rotate:calc(var(--r) + 2.5deg)}}
.L10 .in{display:block;max-width:820px;position:relative;padding-top:34px}
.L10 .vis{position:absolute;left:-24px;top:0;width:var(--sw);z-index:2}
.L10 .story{max-width:none;max-height:none;padding-left:calc(var(--sw) + 8px);min-height:calc(var(--sw)*1.2 + 130px);border:2px dashed rgba(127,166,196,.9)}

@media(max-width:760px){
 .slide{padding:64px 16px 90px}
 .slide .in{flex-direction:column;gap:30px}
 .slide .vis{float:none;position:static;margin:0 auto;width:min(var(--vw),90vw)}
 .story{max-height:none;padding:22px 20px}
 .L5 .in{padding:20px}.L5 .in::after{display:none}
 .L6 .in,.L7 .in{display:flex;padding:22px}
 .L10 .in{display:flex}
 .L10 .story{padding-left:20px;min-height:0}
 #mn{display:none}
}

/* ---- kontrol ---- */
.bt{border:0;background:#fff;color:#1f4468;width:42px;height:42px;border-radius:50%;font:600 16px 'Lora',serif;cursor:pointer;box-shadow:0 3px 8px rgba(31,68,104,.22)}
.bt:active{transform:scale(.94)}
#tb{position:fixed;z-index:4;top:calc(14px + env(safe-area-inset-top,0px));left:14px;display:flex;gap:8px}
#tb .bt{width:38px;height:38px;font-size:15px}
nav{position:fixed;z-index:3;bottom:0;left:0;right:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:center;gap:16px}
#cnt{font:700 22px 'Caveat',cursive;min-width:70px;text-align:center}
body.dk #cnt{color:#fff}
#bar{position:fixed;z-index:4;top:0;left:0;height:4px;background:#fff;width:0;transition:width .5s}
#mp{position:fixed;z-index:4;top:calc(14px + env(safe-area-inset-top,0px));right:14px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.75);padding:4px 14px 4px 4px;border-radius:30px;color:#1f4468}
#mp .bt{width:36px;height:36px;box-shadow:none;background:#e3f1fa}
#mp span{font:700 19px 'Caveat',cursive;max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mp.play #pl{animation:spin 3s linear infinite}
@keyframes spin{to{rotate:360deg}}
#toc{position:fixed;inset:0;z-index:5;background:rgba(233,245,252,.97);display:none;overflow-y:auto;padding:70px 5vw 40px;color:#1f4468}
#toc.on{display:block}
#toc h3{font:600 34px 'Lora',serif;text-align:center;margin-bottom:22px}
#toc .g{max-width:900px;margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 24px}
#toc .g button{background:none;border:0;border-bottom:1px dashed #9cbbd2;text-align:left;padding:10px 4px;font:400 17px 'Lora',serif;color:inherit;cursor:pointer}
#toc .g button b{font:500 22px 'Caveat',cursive;color:#4a90c8;margin-right:8px}
#toc .g button:hover{background:#fff}
#x{position:absolute;top:14px;right:14px}
#lb{position:fixed;inset:0;z-index:9;background:rgba(15,40,66,.88);display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;border:10px solid #fff;border-bottom-width:40px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div class="sky s0 on"></div><div class="sky s1"></div><div class="sky s2"></div>
<div class="cloud" style="top:14%;animation-delay:-10s"></div>
<div class="cloud" style="top:60%;animation-delay:-42s;scale:.8"></div>
<div id="balloons"></div>
<div id="bar"></div>
<div id="tb"><button class="bt" id="tc" aria-label="Daftar isi">☰</button><button class="bt" id="fm" aria-label="Kecilkan huruf">A−</button><button class="bt" id="fp" aria-label="Besarkan huruf">A+</button></div>
<div id="mp"><button class="bt" id="pl" aria-label="Putar musik">♪</button><span id="mn">musik</span><button class="bt" id="nx" aria-label="Lagu berikutnya" style="width:30px;height:30px;font-size:11px">▶▶</button></div>
<main id="stage"></main>
<nav><button class="bt" id="pv" aria-label="Sebelumnya">←</button><div id="cnt"></div><button class="bt" id="nt" aria-label="Berikutnya">→</button></nav>
<div id="toc"><button class="bt" id="x" aria-label="Tutup">✕</button><h3>Daftar Isi</h3><div class="g"></div></div>
<div id="lb"></div>
<audio id="au" preload="none"></audio>

<script>
/* ================= EDIT DI SINI =================
   Tiap slide: ["Judul", `Cerita...`, ["tulisan polaroid 1","polaroid 2",...], ["karakter",...]]
   - Jumlah tulisan polaroid = jumlah foto di slide itu (1 sampai 4)
   - Foto default: media/NOMOR-URUTAN.jpg  (contoh: media/4-1.jpg, media/4-2.jpg)
   - Karakter (opsional): carl, ellie, russell, dug, kevin
   - Cerita: paragraf dipisah SATU BARIS KOSONG, *teks* = huruf miring,
     jangan pakai tanda ` (backtick) di dalam cerita                          */
const SLIDES=[
["Petualangan Kita",`Setiap petualangan besar dimulai dari sesuatu yang kecil. Kadang hanya satu balon, kadang hanya satu hari yang kebetulan berbeda dari hari-hari lainnya.

Buku ini adalah caraku mengikat semuanya, supaya tidak ada yang terbang pergi.`,["mulai ya","bareng","hehe"],["carl","ellie"]],
["Awal Cerita",`Tulis bab ini dengan gayamu sendiri. Pisahkan paragraf dengan satu baris kosong, dan pakai *tanda bintang* untuk huruf miring.

Paragraf kedua akan otomatis menjorok ke dalam seperti di novel cetak.`,["hari pertama"]],
["Pertemuan",``,["hai!","canggung"]],
["Tawa Pertama",``,["hehe","ngakak","lagi","lagi lagi"]],
["Hari Biasa",``,["biasa tapi seru"],["dug"]],
["Jalan-jalan",``,["ayo pergi","di jalan"]],
["Makan Bareng",``,["enak banget"]],
["Foto Random",``,["oops","tiba-tiba"]],
["Hujan",``,["basah","tapi senang"]],
["Senja",``,["langit sore"],["russell"]],
["Obrolan Malam",``,["ngobrol","panjang","sampai larut","masih lanjut"]],
["Rencana",``,["suatu hari","pasti"]],
["Hal Kecil",``,["kecil","tapi berarti","selalu"]],
["Berantem Dikit",``,["tapi baikan"]],
["Kejutan",``,["surprise!","hah?!"],["kevin"]],
["Ulang Tahun",``,["tiup lilin"]],
["Perjalanan",``,["jauh","jauh banget"]],
["Tersesat",``,["ke mana?"]],
["Selfie",``,["say cheese","sekali lagi","ok fix"]],
["Lagu Kita",``,["puter lagi","dengerin"],["carl","russell"]],
["Hari Hujan Lagi",``,["payung satu","basah lagi","hehe"]],
["Capek Tapi Senang",``,["worth it"]],
["Rumah",``,["pulang","hangat"]],
["Teman Seperjalanan",``,["bareng terus","selalu","kita"],["dug","kevin"]],
["Momen Favorit",``,["yang ini","favorit","banget","sumpah"]],
["Pelajaran",``,["makasih","ya"]],
["Yang Kurindu",``,["kangen"],["ellie"]],
["Harapan",``,["semoga","amin"]],
["Petualangan Berikutnya",``,["masih panjang","ayo"]],
["Terima Kasih",`Terima kasih sudah jadi bagian ceritaku.`,["sampai jumpa","sampai nanti"],["carl","russell","dug"]]
];
// Timpa file foto/video tertentu: nomor slide -> daftar file. Contoh:
// 4:["media/4-1.mp4","media/4-2.jpg","media/4-3.jpg","media/4-4.png"]
const MEDIA={ };
// File gambar karakter (PNG transparan). Default: media/karakter/NAMA.png
const CHARIMG={ /* carl:"media/karakter/carl.png" */ };
// Musik: taruh file di folder music/
const MUSIC=[{src:"music/lagu1.mp3",name:"Lagu Kita"}];
/* ================================================ */

const $=s=>document.querySelector(s),st=$('#stage');
const isVid=u=>/\.(mp4|webm|mov|m4v)$/i.test(u);
const lab=i=>i==0?'Prolog':i==SLIDES.length-1?'Epilog':'Bab '+i;
const CH={carl:'Carl',ellie:'Ellie',russell:'Russell',dug:'Dug',kevin:'Kevin'};
const para=t=>t.trim()?t.trim().split(/\n\s*\n/).map(p=>`<p>${p.trim().replace(/\n/g,'<br>').replace(/\*(.+?)\*/g,'<em>$1</em>')}</p>`).join(''):`<p class="ph">Bab ini belum ditulis. Buka index.html di GitHub, cari judul bab ini, lalu tulis ceritamu di sini.</p>`;

// posisi kolase: [ukuran%, x%, y%, miring]; a = tinggi/lebar kotak
const V={
1:[{a:1.125,p:[[100,0,0,-2]]}],
2:[{a:1.1,p:[[62,0,0,-4],[62,38,36.4,3.5]]},{a:1.1,p:[[62,38,0,3],[62,0,36.4,-3.5]]}],
3:[{a:1.05,p:[[54,0,0,-5],[54,23,21,2],[54,46,42,-3]]},{a:.985,p:[[52,0,0,-4],[52,48,6.1,4],[52,24,40.6,-1.5]]}],
4:[{a:1.05,p:[[47,0,0,-4],[47,53,5.7,3],[47,2,43.8,2.5],[47,51,49.5,-3]]},{a:1.05,p:[[47,53,0,4],[47,0,5.7,-3],[47,51,43.8,-2.5],[47,2,49.5,3]]}]};
const V9={2:{a:.56,p:[[48,0,0,-3],[48,52,2,3]]},3:{a:.4,p:[[32,0,0,-3],[34,33,2,2],[32,68,0,-2]]}};

SLIDES.forEach((s,i)=>{
  const n=i+1,caps=s[2].slice(0,4),c=caps.length;
  const paths=MEDIA[n]||caps.map((_,k)=>`media/${n}-${k+1}.jpg`);
  const set=(i%10==8&&c>1)?V9[c]:V[c][i%V[c].length];
  const pics=set.p.map(([k,x,y,r],j)=>{
    const src=paths[j]||`media/${n}-${j+1}.jpg`;
    const el=isVid(src)?`<video src="${src}" controls playsinline preload="metadata" onerror="this.parentNode.classList.add('empty')"></video>`
     :`<img src="${src}" alt="" loading="lazy" onerror="this.parentNode.classList.add('empty')">`;
    return `<figure class="pol" style="--k:${k};--x:${x};--y:${y};--r:${(r+((i*3+j)%5-2)*.5).toFixed(1)}deg"><div class="m" data-p="${src}">${el}</div><figcaption class="cap">${caps[j]||''}</figcaption></figure>`}).join('');
  const chars=(s[3]||[]).map(k=>`<div class="char" data-n="${CH[k]||k}"><img src="${CHARIMG[k]||'media/karakter/'+k+'.png'}" alt="${CH[k]||k}" onerror="this.parentNode.classList.add('empty')"></div>`).join('');
  const d=document.createElement('section');
  d.className=`slide L${i%10+1} P${i%3}`;
  d.innerHTML=`<div class="in" style="--vw:${c==1?330:470}px;--sw:${c==1?230:340}px">
  <div class="vis"><div class="pics" style="--ar:1 / ${set.a}">${pics}</div>${chars?`<div class="chars">${chars}</div>`:''}</div>
  <article class="story"><div class="no">${lab(i)}</div><h2>${s[0]}</h2><div class="body">${para(s[1])}</div></article></div>`;
  st.appendChild(d);
});
const sl=[...st.children];let cur=0;

// perbesar foto
st.addEventListener('click',e=>{const t=e.target;if(t.tagName=='IMG'&&t.closest('.m')&&!t.closest('.empty')){$('#lb').innerHTML=`<img src="${t.src}" alt="">`;$('#lb').classList.add('on')}});
$('#lb').onclick=()=>$('#lb').classList.remove('on');

// daftar isi
const g=$('#toc .g');
SLIDES.forEach((s,i)=>{const b=document.createElement('button');b.innerHTML=`<b>${lab(i)}</b>${s[0]}`;b.onclick=()=>{go(i);$('#toc').classList.remove('on')};g.appendChild(b)});
$('#tc').onclick=()=>$('#toc').classList.add('on');
$('#x').onclick=()=>$('#toc').classList.remove('on');

// ukuran huruf
let fs=18;try{fs=+localStorage.getItem('fs')||18}catch(e){}
function setFs(v){fs=Math.min(26,Math.max(14,v));document.documentElement.style.setProperty('--fs',fs+'px');try{localStorage.setItem('fs',fs)}catch(e){}}
$('#fm').onclick=()=>setFs(fs-2);$('#fp').onclick=()=>setFs(fs+2);setFs(fs);

// balon
const C=['#8ec5ea','#4a90c8','#ffffff','#bfe0f5','#2f6fa8','#f4fafe','#6fb1de','#d6ecf9'];
const bl=C.map((c,i)=>{const b=document.createElement('div');b.className='b';b.style.cssText=`--c:${c};--w:${44+(i*7)%26}px;--d:${3+i%4}s`;$('#balloons').appendChild(b);return b});
const scatter=()=>bl.forEach((b,i)=>{b.style.left=(i%2?2+Math.random()*8:88+Math.random()*8)+'%';b.style.top=(6+Math.random()*56)+'%'});

function go(n){
  cur=(n+sl.length)%sl.length;
  sl.forEach((s,i)=>{s.classList.toggle('on',i==cur);s.querySelectorAll('video').forEach(v=>v.pause())});
  sl[cur].scrollTop=0;sl[cur].querySelector('.story').scrollTop=0;
  document.querySelectorAll('.sky').forEach((s,k)=>s.classList.toggle('on',k==cur%3));
  document.body.classList.toggle('dk',cur%3==2);
  $('#cnt').textContent=`${cur+1} / ${sl.length}`;
  $('#bar').style.width=((cur+1)/sl.length*100)+'%';
  history.replaceState(null,'','#'+(cur+1));scatter();
}
$('#pv').onclick=()=>go(cur-1);$('#nt').onclick=()=>go(cur+1);
addEventListener('keydown',e=>{if(e.key=='ArrowRight')go(cur+1);if(e.key=='ArrowLeft')go(cur-1);if(e.key=='Escape'){$('#toc').classList.remove('on');$('#lb').classList.remove('on')}});
let x0=null,y0=0;
addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6)go(cur+(dx<0?1:-1));x0=null});

// musik
const au=$('#au');let mi=0,started=false;
const on=()=>$('#mp').classList.add('play');
function load(i){mi=(i+MUSIC.length)%MUSIC.length;au.src=MUSIC[mi].src;$('#mn').textContent=MUSIC[mi].name}
$('#pl').onclick=e=>{e.stopPropagation();started=true;if(au.paused){au.play().then(on).catch(()=>{})}else{au.pause();$('#mp').classList.remove('play')}};
$('#nx').onclick=e=>{e.stopPropagation();started=true;load(mi+1);au.play().then(on).catch(()=>{})};
au.onended=()=>{load(mi+1);au.play().catch(()=>{})};
if(MUSIC.length<2)$('#nx').style.display='none';
load(0);
addEventListener('pointerdown',()=>{if(!started){started=true;au.play().then(on).catch(()=>{})}},{once:true});

go((parseInt(location.hash.slice(1))||1)-1);
</script>
</body>
</html>
